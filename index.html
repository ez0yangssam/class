<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모둠 편성기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --ink:#3A3226; --muted:#8A7E6B; --line:#EADFCB; --card:#FFFFFF;
    --accent:#E8743B; --accent-d:#C95C25;
    --g1:#FFD6C9; --g2:#FFE9A8; --g3:#CDEBC5; --g4:#C9E4F5; --g5:#E2D4F2;
    --g6:#F9D2E4; --g7:#D7EFE9; --g8:#F3E1C7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  h1{font-family:'Jua',sans-serif;font-weight:400;font-size:34px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:1fr 260px;gap:20px}
  @media (max-width:760px){.panel{grid-template-columns:1fr}}
  label.t{display:block;font-family:'Jua',sans-serif;font-size:18px;margin-bottom:8px}
  textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;background:#FFFDF8;color:var(--ink)}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .count{font-size:14px;margin-top:6px}
  .count b{color:var(--accent-d)}
  .side{display:flex;flex-direction:column;gap:14px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#FFFDF8;font-size:22px;cursor:pointer;color:var(--ink)}
  .stepper input{width:80px;height:44px;text-align:center;font-family:'Jua',sans-serif;font-size:24px;border:2px solid var(--line);border-radius:12px;color:var(--ink);background:#FFFDF8}
  .per{font-size:14px;color:var(--muted);min-height:20px}
  .btn{border:none;border-radius:14px;padding:14px 16px;font-family:'Jua',sans-serif;font-size:20px;cursor:pointer}
  .btn.main{background:var(--accent);color:#fff}
  .btn.main:hover{background:var(--accent-d)}
  .btn.sub2{background:#FFFDF8;border:2px solid var(--line);color:var(--ink);font-size:16px;padding:10px 14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .err{color:#C0392B;font-size:14px;min-height:18px}
  #result{margin-top:26px}
  .rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .rhead h2{font-family:'Jua',sans-serif;font-weight:400;font-size:24px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .group{border-radius:18px;padding:16px 18px;border:2px solid rgba(0,0,0,.05);animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .group h3{font-family:'Jua',sans-serif;font-weight:400;font-size:24px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
  .group h3 span{font-size:15px;color:var(--muted)}
  .group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .group li{background:rgba(255,255,255,.75);border-radius:10px;padding:8px 12px;font-size:19px}
  .big .group li{font-size:26px;padding:10px 14px}
  .big .group h3{font-size:32px}
  .big .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 모둠 편성기</h1>
  <p class="sub">명단을 넣고 모둠 수를 정하면, 인원이 고르게 무작위로 나뉩니다.</p>

  <div class="panel">
    <div>
      <label class="t" for="names">학생 명단</label>
      <textarea id="names" placeholder="한 줄에 한 명씩, 또는 쉼표로 구분해 입력하세요.&#10;예) 1번, 2번, 3번 ...&#10;또는 김OO&#10;이OO"></textarea>
      <div class="hint">엑셀에서 이름 열을 복사해 그대로 붙여넣어도 됩니다. 중복 이름은 자동으로 구분됩니다.</div>
      <div class="count">현재 <b id="cnt">0</b>명</div>
    </div>
    <div class="side">
      <div>
        <label class="t" for="gn">모둠 수</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="줄이기">−</button>
          <input id="gn" type="number" min="1" value="4">
          <button type="button" id="plus" aria-label="늘리기">+</button>
        </div>
        <div class="per" id="per"></div>
      </div>
      <button class="btn main" id="go">모둠 만들기</button>
      <div class="row">
        <button class="btn sub2" id="sample">예시 명단</button>
        <button class="btn sub2" id="clear">지우기</button>
      </div>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div id="result" hidden>
    <div class="rhead">
      <h2>편성 결과</h2>
      <div class="row">
        <button class="btn sub2" id="again">🔀 다시 섞기</button>
        <button class="btn sub2" id="copy">📋 결과 복사</button>
        <button class="btn sub2" id="bigBtn">🔍 크게 보기</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const colors = ['--g1','--g2','--g3','--g4','--g5','--g6','--g7','--g8'];
let lastGroups = null;

function getNames(){
  const raw = $('names').value.split(/[\n,\t]+/).map(s=>s.trim()).filter(Boolean);
  const seen = {};
  return raw.map(n=>{
    seen[n] = (seen[n]||0)+1;
    return seen[n]>1 ? `${n}(${seen[n]})` : n;
  });
}
function shuffle(a){
  const arr=a.slice();
  for(let i=arr.length-1;i>0;i--){
    const r=new Uint32Array(1); crypto.getRandomValues(r);
    const j=r[0]%(i+1); [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function updateInfo(){
  const n=getNames().length, g=parseInt($('gn').value)||0;
  $('cnt').textContent=n;
  if(n>0 && g>0 && g<=n){
    const base=Math.floor(n/g), extra=n%g;
    $('per').textContent = extra
      ? `${base+1}명 모둠 ${extra}개, ${base}명 모둠 ${g-extra}개`
      : `모둠당 ${base}명`;
  } else $('per').textContent='';
  try{ localStorage.setItem('gm_names',$('names').value); localStorage.setItem('gm_gn',$('gn').value);}catch(e){}
}
function make(){
  const names=getNames(), g=parseInt($('gn').value)||0;
  $('err').textContent='';
  if(!names.length){$('err').textContent='명단을 먼저 입력해 주세요.';return;}
  if(g<1){$('err').textContent='모둠 수는 1 이상이어야 합니다.';return;}
  if(g>names.length){$('err').textContent=`모둠 수가 인원(${names.length}명)보다 많아요.`;return;}
  const s=shuffle(names);
  const groups=Array.from({length:g},()=>[]);
  // 인원이 더 많은 모둠도 무작위로 정해지도록 모둠 순서도 섞어서 배분
  const order=shuffle([...Array(g).keys()]);
  s.forEach((name,i)=>groups[order[i%g]].push(name));
  lastGroups=groups; render();
}
function render(){
  const grid=$('grid'); grid.innerHTML='';
  lastGroups.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='group';
    d.style.background=`var(${colors[i%colors.length]})`;
    d.style.animationDelay=(i*60)+'ms';
    const h=document.createElement('h3');
    h.textContent=`${i+1}모둠 `;
    const sp=document.createElement('span'); sp.textContent=`${m.length}명`; h.appendChild(sp);
    const ul=document.createElement('ul');
    m.forEach(n=>{const li=document.createElement('li'); li.textContent=n; ul.appendChild(li);});
    d.append(h,ul); grid.appendChild(d);
  });
  $('result').hidden=false;
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600);}

$('names').addEventListener('input',updateInfo);
$('gn').addEventListener('input',updateInfo);
$('minus').onclick=()=>{$('gn').value=Math.max(1,(parseInt($('gn').value)||1)-1);updateInfo();};
$('plus').onclick=()=>{$('gn').value=(parseInt($('gn').value)||0)+1;updateInfo();};
$('go').onclick=make;
$('again').onclick=make;
$('sample').onclick=()=>{$('names').value=Array.from({length:25},(_,i)=>`${i+1}번`).join('\n');updateInfo();};
$('clear').onclick=()=>{$('names').value='';updateInfo();$('result').hidden=true;};
$('bigBtn').onclick=()=>{
  const on=document.body.classList.toggle('big');
  $('bigBtn').textContent= on?'🔍 기본 크기':'🔍 크게 보기';
};
$('copy').onclick=async()=>{
  if(!lastGroups) return;
  const text=lastGroups.map((m,i)=>`${i+1}모둠(${m.length}명): ${m.join(', ')}`).join('\n');
  try{await navigator.clipboard.writeText(text);toast('결과를 복사했어요');}
  catch(e){toast('복사가 안 되면 결과를 직접 드래그해 주세요');}
};
try{
  const n=localStorage.getItem('gm_names'), g=localStorage.getItem('gm_gn');
  if(n) $('names').value=n; if(g) $('gn').value=g;
}catch(e){}
updateInfo();
</script>
</body>
</html>
