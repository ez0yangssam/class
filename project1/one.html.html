<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식품구성자전거 학습지</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .student-info {
            display: flex;
            justify-content: space-between;
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        .student-info input {
            width: 60px;
            padding: 5px;
            margin-left: 5px;
        }
        .student-info input.name-input {
            width: 100px;
        }
        .question-block {
            margin-bottom: 25px;
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>식품구성자전거 학습지</h1>
    
    <form id="worksheet-form">
        <!-- 학생 정보 입력 -->
        <div class="student-info">
            <div>
                <label for="grade">학년:</label>
                <input type="number" id="grade" required>
            </div>
            <div>
                <label for="classNum">반:</label>
                <input type="number" id="classNum" required>
            </div>
            <div>
                <label for="studentNum">번호:</label>
                <input type="number" id="studentNum" required>
            </div>
            <div>
                <label for="studentName">이름:</label>
                <input type="text" id="studentName" class="name-input" required>
            </div>
        </div>

        <!-- 객관식 3문제 -->
        <div class="question-block">
            <div class="question-title">1. 식품구성자전거의 뒷바퀴 면적이 다르게 나뉘어 있는 이유는 무엇일까요?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="1" required> ① 6가지 식품군을 모두 같은 양으로 먹기 위해</label>
                <label><input type="radio" name="q1" value="2"> ② 식품군별로 하루에 섭취해야 할 권장량이 다르기 때문에</label>
                <label><input type="radio" name="q1" value="3"> ③ 수분을 많이 섭취하기 위해</label>
                <label><input type="radio" name="q1" value="4"> ④ 자전거를 균형 있게 잘 타기 위해</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-title">2. 식품구성자전거의 앞바퀴에 있는 물잔이 의미하는 것은 무엇인가요?</div>
            <div class="options">
                <label><input type="radio" name="q2" value="1" required> ① 식사 후 손 씻기</label>
                <label><input type="radio" name="q2" value="2"> ② 충분한 수분 섭취</label>
                <label><input type="radio" name="q2" value="3"> ③ 우유 매일 마시기</label>
                <label><input type="radio" name="q2" value="4"> ④ 달콤한 음료 마시기</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-title">3. 다음 중 식품구성자전거에 포함된 6가지 식품군이 아닌 것은 무엇인가요?</div>
            <div class="options">
                <label><input type="radio" name="q3" value="1" required> ① 곡류</label>
                <label><input type="radio" name="q3" value="2"> ② 고기·생선·달걀·콩류</label>
                <label><input type="radio" name="q3" value="3"> ③ 채소류</label>
                <label><input type="radio" name="q3" value="4"> ④ 과자·아이스크림류</label>
            </div>
        </div>

        <!-- 주관식 2문제 -->
        <div class="question-block">
            <div class="question-title">4. 식품구성자전거에서 사람이 자전거를 타고 있는 모습은 어떤 의미를 담고 있는지 서술하시오.</div>
            <textarea id="q4" placeholder="이곳에 답안을 작성하세요." required></textarea>
        </div>

        <div class="question-block">
            <div class="question-title">5. 오늘 자신이 먹은 식사를 떠올려보고, 식품구성자전거를 참고하여 부족했던 식품군은 무엇이었는지, 앞으로 어떻게 보충할지 적어보세요.</div>
            <textarea id="q5" placeholder="이곳에 답안을 작성하세요." required></textarea>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" class="submit-btn">제출하기</button>
    </form>
</div>

<!-- Firebase SDK -->
<script type="module">
    // Firebase 앱 및 Firestore 가져오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    // 제공해주신 Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyAbb83xNzKfKiYzydq4BpcpFiEajFWhr2A",
        authDomain: "vibecording-48ecb.firebaseapp.com",
        projectId: "vibecording-48ecb",
        storageBucket: "vibecording-48ecb.firebasestorage.app",
        messagingSenderId: "264848079619",
        appId: "1:264848079619:web:23cb37423301544534c736",
        measurementId: "G-3JVDMH4SYC"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    
    // Firestore DB 인스턴스 생성
    const db = getFirestore(app);

    // 폼 제출 이벤트 처리
    document.getElementById('worksheet-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // 기본 제출 동작(새로고침) 방지

        // 제출 버튼 비활성화 (중복 제출 방지)
        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = "제출 중...";

        // 폼 데이터 수집
        const grade = document.getElementById('grade').value;
        const classNum = document.getElementById('classNum').value;
        const studentNum = document.getElementById('studentNum').value;
        const studentName = document.getElementById('studentName').value;
        
        // 라디오 버튼 선택 값 가져오기
        const q1 = document.querySelector('input[name="q1"]:checked').value;
        const q2 = document.querySelector('input[name="q2"]:checked').value;
        const q3 = document.querySelector('input[name="q3"]:checked').value;
        
        // 주관식 텍스트 가져오기
        const q4 = document.getElementById('q4').value;
        const q5 = document.getElementById('q5').value;

        try {
            // Firestore 'worksheets' 컬렉션에 문서 추가
            const docRef = await addDoc(collection(db, "worksheets"), {
                grade: Number(grade),
                classNum: Number(classNum),
                studentNum: Number(studentNum),
                studentName: studentName,
                answers: {
                    q1: q1,
                    q2: q2,
                    q3: q3,
                    q4: q4,
                    q5: q5
                },
                submittedAt: new Date()
            });
            
            alert("학습지 제출이 완료되었습니다!");
            document.getElementById('worksheet-form').reset(); // 폼 초기화
            
        } catch (error) {
            console.error("문서 추가 중 오류 발생: ", error);
            alert("제출에 실패했습니다. 다시 시도해주세요.");
        } finally {
            // 버튼 상태 복구
            submitBtn.disabled = false;
            submitBtn.innerText = "제출하기";
        }
    });
</script>

</body>
</html>
