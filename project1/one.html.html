<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Animation</title>
    <!-- Tailwind CSS for clean and modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Prevent scrolling and center the content */
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Slate-900 */
            font-family: 'Inter', sans-serif;
        }

        /* Canvas styling for the rectangular background */
        canvas {
            display: block;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center gap-6 w-full py-8">
        <!-- Dynamic Canvas Title -->
        <h2 id="canvasTitle" class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 text-center tracking-tight break-all px-4">
            Bouncing Ball
        </h2>

        <!-- Container to control canvas size responsively -->
        <div class="relative w-[90vw] h-[60vh] max-w-5xl">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>
        </div>

        <!-- Controls container -->
        <div class="flex flex-wrap justify-center items-center gap-4 w-full max-w-4xl px-4">
            <!-- Text Input for Title -->
            <input type="text" id="titleInput" placeholder="제목을 입력하세요..." class="flex-1 min-w-[200px] px-5 py-3 bg-slate-800 text-white rounded-full border border-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/50 transition-all placeholder-slate-400 shadow-inner">
            
            <!-- Speed Range Input -->
            <div class="flex items-center gap-3 w-full sm:w-auto px-5 py-3 bg-slate-800 rounded-full border border-slate-700 shadow-inner">
                <label for="speedRange" class="text-slate-300 text-sm font-semibold whitespace-nowrap">속도</label>
                <input type="range" id="speedRange" min="2" max="20" value="8" class="w-24 md:w-32 accent-cyan-500 cursor-pointer">
            </div>

            <!-- Trail Effect Checkbox -->
            <div class="flex items-center gap-3 w-full sm:w-auto px-5 py-3 bg-slate-800 rounded-full border border-slate-700 shadow-inner cursor-pointer hover:bg-slate-750 transition-colors" onclick="document.getElementById('trailCheck').click()">
                <input type="checkbox" id="trailCheck" class="w-5 h-5 accent-cyan-500 cursor-pointer" onclick="event.stopPropagation()">
                <label for="trailCheck" class="text-slate-300 text-sm font-semibold whitespace-nowrap cursor-pointer pointer-events-none">잔상 효과</label>
            </div>

            <!-- Ball Size Radio Buttons -->
            <div class="flex items-center gap-3 w-full sm:w-auto px-5 py-3 bg-slate-800 rounded-full border border-slate-700 shadow-inner">
                <span class="text-slate-300 text-sm font-semibold whitespace-nowrap pr-2">크기</span>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="radio" name="ballSize" value="15" class="accent-cyan-500 cursor-pointer w-4 h-4"> 작게
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="radio" name="ballSize" value="25" class="accent-cyan-500 cursor-pointer w-4 h-4" checked> 중간
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="radio" name="ballSize" value="40" class="accent-cyan-500 cursor-pointer w-4 h-4"> 크게
                </label>
            </div>

            <!-- Shape Checkboxes -->
            <div class="flex items-center gap-3 w-full sm:w-auto px-5 py-3 bg-slate-800 rounded-full border border-slate-700 shadow-inner">
                <span class="text-slate-300 text-sm font-semibold whitespace-nowrap pr-2">모양</span>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="checkbox" id="checkCircle" value="circle" class="accent-emerald-500 cursor-pointer w-4 h-4" checked> 원
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="checkbox" id="checkTriangle" value="triangle" class="accent-red-500 cursor-pointer w-4 h-4"> 세모
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer text-slate-300 hover:text-white text-sm transition-colors">
                    <input type="checkbox" id="checkSquare" value="square" class="accent-yellow-500 cursor-pointer w-4 h-4"> 네모
                </label>
            </div>

            <!-- Color change button -->
            <button id="colorBtn" class="w-full sm:w-auto whitespace-nowrap px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white font-bold rounded-full shadow-lg transition-transform transform hover:-translate-y-1 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-500/50">
                색상 변경
            </button>
        </div>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;

        // Global properties
        let globalRadius = 25;
        let globalSpeed = 8;

        // Shapes array holding state for each type of shape
        const shapes = [
            { type: 'circle', x: 0, y: 0, dx: 0, dy: 0, color: '#10b981', defaultColor: '#10b981', active: true },
            { type: 'triangle', x: 0, y: 0, dx: 0, dy: 0, color: '#ef4444', defaultColor: '#ef4444', active: false },
            { type: 'square', x: 0, y: 0, dx: 0, dy: 0, color: '#eab308', defaultColor: '#eab308', active: false }
        ];

        // Function to resize canvas to match its container exactly
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Ensure all active shapes stay within bounds when resizing the window
            shapes.forEach(shape => {
                if (shape.active) {
                    if (shape.x + globalRadius > canvas.width) shape.x = canvas.width - globalRadius;
                    if (shape.y + globalRadius > canvas.height) shape.y = canvas.height - globalRadius;
                }
            });
        }

        // Spawn a shape at the center with a random angle
        function spawnShape(shape) {
            shape.x = canvas.width / 2;
            shape.y = canvas.height / 2;
            const angle = Math.random() * Math.PI * 2;
            shape.dx = Math.cos(angle) * globalSpeed;
            shape.dy = Math.sin(angle) * globalSpeed;
        }

        // Initialize the animation
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Spawn initially active shapes
            shapes.forEach(shape => {
                if (shape.active) spawnShape(shape);
            });

            // Setup button event listener
            document.getElementById('colorBtn').addEventListener('click', changeBallColor);

            // Setup text input event listener to change title in real-time
            const titleInput = document.getElementById('titleInput');
            const canvasTitle = document.getElementById('canvasTitle');
            titleInput.addEventListener('input', function(e) {
                canvasTitle.textContent = e.target.value.trim() !== '' ? e.target.value : 'Bouncing Ball';
            });

            // Setup speed range event listener
            const speedRange = document.getElementById('speedRange');
            speedRange.addEventListener('input', function(e) {
                globalSpeed = parseFloat(e.target.value);
                shapes.forEach(shape => {
                    if (shape.active) {
                        const currentMag = Math.sqrt(shape.dx * shape.dx + shape.dy * shape.dy);
                        if (currentMag > 0) {
                            shape.dx = (shape.dx / currentMag) * globalSpeed; 
                            shape.dy = (shape.dy / currentMag) * globalSpeed;
                        }
                    }
                });
            });

            // Setup size radio buttons event listener
            const sizeRadios = document.querySelectorAll('input[name="ballSize"]');
            sizeRadios.forEach(radio => {
                radio.addEventListener('change', function(e) {
                    globalRadius = parseInt(e.target.value);
                    
                    // Prevent shapes from getting stuck in walls if they grow while near an edge
                    shapes.forEach(shape => {
                        if (shape.active) {
                            if (shape.x - globalRadius < 0) shape.x = globalRadius;
                            if (shape.x + globalRadius > canvas.width) shape.x = canvas.width - globalRadius;
                            if (shape.y - globalRadius < 0) shape.y = globalRadius;
                            if (shape.y + globalRadius > canvas.height) shape.y = canvas.height - globalRadius;
                        }
                    });
                });
            });

            // Setup shape checkboxes event listener
            function setupCheckbox(id, type) {
                document.getElementById(id).addEventListener('change', function(e) {
                    const shape = shapes.find(s => s.type === type);
                    shape.active = e.target.checked;
                    if (shape.active) {
                        shape.color = shape.defaultColor; // Reset to default color on activation
                        spawnShape(shape);
                    }
                });
            }
            setupCheckbox('checkCircle', 'circle');
            setupCheckbox('checkTriangle', 'triangle');
            setupCheckbox('checkSquare', 'square');

            // Start animation loop
            requestAnimationFrame(animate);
        }

        // Function to change colors of all active shapes randomly
        function changeBallColor() {
            const colors = ['#06b6d4', '#f43f5e', '#10b981', '#8b5cf6', '#f59e0b', '#3b82f6', '#ec4899', '#14b8a6', '#eab308'];
            
            shapes.forEach(shape => {
                if (shape.active) {
                    let newColor = shape.color;
                    while (newColor === shape.color) {
                        newColor = colors[Math.floor(Math.random() * colors.length)];
                    }
                    shape.color = newColor;
                }
            });
        }

        // Draw a single shape
        function drawShape(shape) {
            ctx.beginPath();
            
            if (shape.type === 'circle') {
                ctx.arc(shape.x, shape.y, globalRadius, 0, Math.PI * 2);
            } else if (shape.type === 'square') {
                ctx.rect(shape.x - globalRadius, shape.y - globalRadius, globalRadius * 2, globalRadius * 2);
            } else if (shape.type === 'triangle') {
                ctx.moveTo(shape.x, shape.y - globalRadius); // Top vertex
                ctx.lineTo(shape.x + globalRadius, shape.y + globalRadius); // Bottom right
                ctx.lineTo(shape.x - globalRadius, shape.y + globalRadius); // Bottom left
            }
            
            // Add a radial gradient for a 3D effect
            const gradient = ctx.createRadialGradient(
                shape.x - globalRadius / 3, 
                shape.y - globalRadius / 3, 
                globalRadius / 4, 
                shape.x, 
                shape.y, 
                globalRadius
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)'); // Generic light reflection
            gradient.addColorStop(1, shape.color); // Base color
            
            ctx.fillStyle = gradient;
            
            // Add a subtle drop shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 5;
            ctx.shadowOffsetY = 10;
            
            ctx.fill();
            ctx.closePath();

            // Reset shadow so it doesn't affect other potential drawings
            ctx.shadowColor = 'transparent';
        }

        // Update shape position and handle wall collisions
        function updateShape(shape) {
            // Bounce off left and right walls
            if (shape.x + globalRadius >= canvas.width || shape.x - globalRadius <= 0) {
                shape.dx = -shape.dx;
                if (shape.x - globalRadius <= 0) shape.x = globalRadius;
                if (shape.x + globalRadius >= canvas.width) shape.x = canvas.width - globalRadius;
            }
            
            // Bounce off top and bottom walls
            if (shape.y + globalRadius >= canvas.height || shape.y - globalRadius <= 0) {
                shape.dy = -shape.dy;
                if (shape.y - globalRadius <= 0) shape.y = globalRadius;
                if (shape.y + globalRadius >= canvas.height) shape.y = canvas.height - globalRadius;
            }

            // Move
            shape.x += shape.dx;
            shape.y += shape.dy;
        }

        // The main animation loop
        function animate() {
            const trailCheck = document.getElementById('trailCheck').checked;

            if (trailCheck) {
                const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                bgGradient.addColorStop(0, 'rgba(30, 41, 59, 0.25)');
                bgGradient.addColorStop(1, 'rgba(15, 23, 42, 0.25)');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            
            // Update and draw all active shapes
            shapes.forEach(shape => {
                if (shape.active) {
                    updateShape(shape);
                    drawShape(shape);
                }
            });
            
            requestAnimationFrame(animate);
        }

        // Run the initialization when the page is fully loaded
        window.onload = init;
    </script>
</body>
</html>
